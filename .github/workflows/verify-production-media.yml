name: Verify production demo media

on:
  push:
    branches:
      - fix/demo-media-integrity-v3

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Verify production stream integrity
        shell: bash
        run: |
          set -euo pipefail
          url="https://amtlis-production.up.railway.app/api/v1/videos/11111111-1111-1111-1111-111111111111/stream"
          expected_sha256="36befce84538f0c04f3f1106964ed9cbc207382137b58ea1da7578d960967406"

          curl --fail --silent --show-error --location --dump-header /tmp/full.headers "$url" --output /tmp/video.mp4

          size=$(stat --format='%s' /tmp/video.mp4)
          sha256=$(sha256sum /tmp/video.mp4 | awk '{print $1}')
          codec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nokey=1:noprint_wrappers=1 /tmp/video.mp4)
          width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nokey=1:noprint_wrappers=1 /tmp/video.mp4)
          height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nokey=1:noprint_wrappers=1 /tmp/video.mp4)
          fps=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=nokey=1:noprint_wrappers=1 /tmp/video.mp4)
          declared=$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of default=nokey=1:noprint_wrappers=1 /tmp/video.mp4)
          decoded=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of default=nokey=1:noprint_wrappers=1 /tmp/video.mp4)
          duration=$(ffprobe -v error -show_entries format=duration -of default=nokey=1:noprint_wrappers=1 /tmp/video.mp4)

          echo "Production full response headers:"
          cat /tmp/full.headers
          echo "size=$size"
          echo "sha256=$sha256"
          echo "duration=$duration"
          echo "codec=$codec"
          echo "resolution=${width}x${height}"
          echo "fps=$fps"
          echo "frames=${decoded}/${declared}"

          test "$size" = "325773"
          test "$sha256" = "$expected_sha256"
          test "$codec" = "h264"
          test "$width" = "640"
          test "$height" = "360"
          test "$fps" = "24/1"
          test "$declared" = "144"
          test "$decoded" = "144"
          awk -v d="$duration" 'BEGIN { exit !(d >= 5.99 && d <= 6.01) }'
          ffmpeg -v error -xerror -i /tmp/video.mp4 -f null -

      - name: Verify production HTTP Range
        shell: bash
        run: |
          set -euo pipefail
          url="https://amtlis-production.up.railway.app/api/v1/videos/11111111-1111-1111-1111-111111111111/stream"

          curl --fail --silent --show-error --location --dump-header /tmp/range.headers --header 'Range: bytes=0-999' "$url" --output /tmp/range.bin

          echo "Production range response headers:"
          cat /tmp/range.headers

          status=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' /tmp/range.headers)
          content_range=$(awk 'BEGIN{IGNORECASE=1} /^Content-Range:/ {gsub("\r", ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit}' /tmp/range.headers)
          range_size=$(stat --format='%s' /tmp/range.bin)

          echo "status=$status"
          echo "content_range=$content_range"
          echo "range_size=$range_size"

          test "$status" = "206"
          test "$content_range" = "bytes 0-999/325773"
          test "$range_size" = "1000"
