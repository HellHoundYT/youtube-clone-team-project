name: Regenerate bundled demo media

on:
  push:
    branches:
      - fix/demo-media-integrity-v3

permissions:
  contents: write

jobs:
  regenerate:
    if: contains(github.event.head_commit.message, '[regen-demo]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/demo-media-integrity-v3
          fetch-depth: 0

      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Generate and validate canonical demo MP4
        shell: bash
        run: |
          set -euo pipefail
          output=/tmp/amtlis-demo.mp4

          ffmpeg \
            -hide_banner \
            -loglevel error \
            -f lavfi \
            -i "testsrc2=size=640x360:rate=24" \
            -t 6 \
            -frames:v 144 \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -preset medium \
            -crf 28 \
            -movflags +faststart \
            -an \
            -y \
            "$output"

          codec=$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nokey=1:noprint_wrappers=1 "$output")
          width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nokey=1:noprint_wrappers=1 "$output")
          height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nokey=1:noprint_wrappers=1 "$output")
          fps=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=nokey=1:noprint_wrappers=1 "$output")
          declared=$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of default=nokey=1:noprint_wrappers=1 "$output")
          decoded=$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of default=nokey=1:noprint_wrappers=1 "$output")
          duration=$(ffprobe -v error -show_entries format=duration -of default=nokey=1:noprint_wrappers=1 "$output")

          test "$codec" = "h264"
          test "$width" = "640"
          test "$height" = "360"
          test "$fps" = "24/1"
          test "$declared" = "144"
          test "$decoded" = "144"
          awk -v d="$duration" 'BEGIN { exit !(d >= 5.99 && d <= 6.01) }'
          ffmpeg -v error -xerror -i "$output" -f null -

          sha256sum "$output"
          echo "Validated canonical demo: duration=$duration frames=$decoded/$declared codec=$codec size=${width}x${height} fps=$fps"

      - name: Replace all ten bundled demo videos
        shell: bash
        run: |
          set -euo pipefail
          source=/tmp/amtlis-demo.mp4
          dir=backend/Storage/media/videos

          files=(
            11111111-1111-1111-1111-111111111111.mp4
            22222222-2222-2222-2222-222222222222.mp4
            33333333-3333-3333-3333-333333333333.mp4
            44444444-4444-4444-4444-444444444444.mp4
            55555555-5555-5555-5555-555555555555.mp4
            66666666-6666-6666-6666-666666666666.mp4
            77777777-7777-7777-7777-777777777777.mp4
            88888888-8888-8888-8888-888888888888.mp4
            99999999-9999-9999-9999-999999999999.mp4
            10101010-1010-1010-1010-101010101010.mp4
          )

          for name in "${files[@]}"; do
            cp "$source" "$dir/$name"
          done

          hashes=$(sha256sum "$dir"/*.mp4 | awk '{print $1}' | sort -u)
          test "$(printf '%s\n' "$hashes" | wc -l)" -eq 1
          echo "All bundled demo videos share SHA256: $hashes"

      - name: Commit validated binary assets
        shell: bash
        run: |
          set -euo pipefail

          rm .github/workflows/regenerate-demo-media.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/Storage/media/videos/*.mp4
          git add .github/workflows/regenerate-demo-media.yml
          git commit -m "fix: replace demo media with runner-validated MP4"
          git push origin HEAD:fix/demo-media-integrity-v3
